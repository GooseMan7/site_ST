<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Операция КИБЕРЩИТ — интерактивный урок для 1–2 классов</title>
<style>
:root{--ink:#1c2333;--muted:#5b6374;--yellow:#ffdc3d;--yellow2:#fff1aa;--blue:#4b6ff0;--cream:#fffaf0;--white:#fff;--green:#11744f;--red:#b73940;--border:#e3e7ed;--shadow:0 12px 35px rgba(26,38,72,.12)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,'Helvetica Neue',sans-serif;color:var(--ink)}body{background:radial-gradient(circle at 10% 8%,#fff6c6,transparent 40%),radial-gradient(circle at 95% 80%,#dfe8ff,transparent 45%),#f5f7fc}button{font-family:inherit;cursor:pointer}button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}.app{max-width:1050px;margin:0 auto;padding:22px 22px 36px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:800}.brand-mark{background:var(--yellow);height:44px;width:44px;border-radius:13px;display:grid;place-items:center;font-size:25px;box-shadow:0 4px 0 #e5bb19}.brand-sub{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:3px}.teacher{border:2px solid #d4d9e4;background:white;border-radius:14px;padding:10px 15px;font-size:14px;font-weight:700;color:var(--ink)}.panel{background:rgba(255,255,255,.96);border:1px solid var(--border);border-radius:28px;box-shadow:var(--shadow);padding:34px;min-height:540px}.intro-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center}.eyebrow{font-weight:900;color:#675700;font-size:13px;letter-spacing:.09em;text-transform:uppercase}.intro h1{font-size:clamp(34px,5vw,57px);line-height:1.06;letter-spacing:-.04em;margin:16px 0}.intro p{font-size:20px;line-height:1.5;color:#4a5264;max-width:550px}.hero{display:flex;align-items:center;justify-content:center;position:relative;min-height:350px}.halo{width:300px;height:300px;border-radius:50%;background:linear-gradient(135deg,#ffeb75,#ffe7bd);position:absolute;transform:rotate(-10deg)}.robot{position:relative;width:min(100%,330px);filter:drop-shadow(0 12px 10px rgba(30,30,30,.13));animation:float 3.5s ease-in-out infinite}.hero-bubble{position:absolute;right:0;top:0;background:white;border:2px solid #ebedf4;border-radius:20px;padding:13px 16px;font-weight:900;transform:rotate(5deg)}@keyframes float{50%{transform:translateY(-10px)}}.grade-label{font-weight:800;margin-top:22px;margin-bottom:12px}.grade-row{display:flex;gap:12px;flex-wrap:wrap}.grade{border:2px solid #d5dbe5;background:#fff;border-radius:16px;padding:15px 24px;font-weight:900;font-size:18px}.grade.active{border-color:#1f315e;background:#fff6c4}.primary{border:0;background:var(--yellow);color:#171717;border-radius:18px;padding:17px 28px;font-size:19px;font-weight:900;box-shadow:0 5px 0 #d3b62c;transition:transform .1s}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #d3b62c}.secondary{border:2px solid #d9dfec;background:white;color:#1d2840;border-radius:16px;padding:13px 18px;font-size:16px;font-weight:800}.actions{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:25px}.hint{color:var(--muted);font-size:13px}.progress{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:16px}.mission-tag{font-size:13px;color:#5b6575;font-weight:800}.mission-title{font-size:25px;font-weight:900;margin-top:5px}.dots{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.dot{width:15px;height:15px;border-radius:50%;background:#dfe3ec}.dot.done{background:#20a27a}.dot.current{background:#ffcd25;box-shadow:0 0 0 4px #fff1b0}.story{background:#f8faff;border:1px solid #e8ebf5;border-radius:22px;padding:24px;display:flex;align-items:center;gap:22px;margin:20px 0}.story-icon{width:110px;height:110px;border-radius:26px;background:#fff0b6;display:grid;place-items:center;font-size:62px;flex:none}.story .label{font-size:13px;color:#6b7380;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.story h2{font-size:clamp(23px,3.5vw,34px);line-height:1.3;margin:9px 0 0}.question{font-size:21px;font-weight:900;margin:25px 0 14px}.choices{display:grid;grid-template-columns:1fr;gap:11px}.choice{display:flex;align-items:center;text-align:left;gap:16px;width:100%;background:#fff;border:2px solid #dce1eb;border-radius:17px;padding:14px 16px;min-height:70px;color:#1d2639;font-size:19px;font-weight:700;transition:border-color .1s,background .1s}.choice:hover:not(:disabled){border-color:#8595b5;background:#f8faff}.choice:disabled{cursor:default}.choice .letter{display:grid;place-items:center;flex:none;width:39px;height:39px;border-radius:12px;background:#eef1f7;color:#303c57;font-size:16px}.choice.correct{border-color:#23a578;background:#edfff6}.choice.wrong{border-color:#e28c92;background:#fff2f2}.feedback{margin-top:18px;padding:18px 20px;border-radius:16px;font-size:18px;line-height:1.45}.feedback.good{background:#e9fff4;border:2px solid #8cdbb9}.feedback.retry{background:#fff3ef;border:2px solid #efb4a5}.feedback strong{display:block;margin-bottom:5px}.feedback-actions{display:flex;justify-content:flex-end;margin-top:14px}.milestone{text-align:center;padding:16px 8px}.milestone .big{font-size:88px;margin:16px}.milestone h2{font-size:36px;margin:12px 0}.milestone p{font-size:21px;color:#505a6a;max-width:650px;margin:10px auto;line-height:1.45}.shield-pieces{display:flex;justify-content:center;gap:13px;flex-wrap:wrap;margin:28px 0}.shield-piece{display:grid;place-items:center;width:76px;height:76px;border-radius:20px;border:3px dashed #c9d0df;font-size:38px;background:#f7f8fb;filter:grayscale(1);opacity:.45}.shield-piece.earned{background:#fff0a5;border:3px solid #f3c02c;filter:none;opacity:1}.role-switch{background:#eef3ff;border:2px solid #a9b9ed;padding:18px;border-radius:17px;font-size:19px;font-weight:800;margin:24px auto;max-width:650px}.final h1{font-size:42px}.final .rule{background:#fff6cb;border:1px solid #f5dc77;border-radius:17px;padding:16px;margin:10px auto;max-width:640px;font-weight:900;font-size:21px}.teacher-view h2{font-size:30px}.teacher-view h3{margin:24px 0 9px}.teacher-view p,.teacher-view li{font-size:17px;line-height:1.55}.teacher-view ul{padding-left:24px}.teacher-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.teacher-box{border:1px solid var(--border);background:#f8faff;border-radius:17px;padding:16px}.small-footer{text-align:center;font-size:12px;color:#727c8d;margin-top:22px}.hide{display:none!important}@media(max-width:760px){.panel{padding:22px;min-height:auto}.intro-grid{grid-template-columns:1fr}.hero{min-height:230px}.halo{width:210px;height:210px}.robot{width:210px}.hero-bubble{right:5px;top:-4px}.story{align-items:flex-start;gap:14px;padding:17px}.story-icon{width:70px;height:70px;font-size:40px;border-radius:16px}.story h2{font-size:23px}.teacher-grid{grid-template-columns:1fr}.header{flex-wrap:wrap}.choice{font-size:17px}}@media(prefers-reduced-motion:reduce){.robot{animation:none}}@media print{body{background:white}.header,.actions,.small-footer{display:none}.panel{box-shadow:none;border:none}.teacher-view{display:block!important}}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="brand"><div class="brand-mark">А</div><div>АЛГОРИТМИКА <span class="brand-sub">ГМШ • Урок кибербезопасности • 1–2 классы</span></div></div>
  <button class="teacher" id="teacherButton" type="button">👩‍🏫 Для преподавателя</button>
</header>
<main id="main" class="panel" aria-live="polite"></main>
<div class="small-footer">Работает без интернета • Не собирает имена, телефоны, пароли или ответы • Не требует регистрации</div>
</div>
<script>
(function(){
'use strict';
const main=document.getElementById('main');
const teacherButton=document.getElementById('teacherButton');
let grade=1, screen='start', questionIndex=0, selected=null, correct=false, teacherBack='start';
const missions=[
 {name:'Секреты Пикселя',icon:'🔐',win:'Личные данные нужно защищать. Адрес, пароль и телефон не сообщаем посторонним!',items:[
  {icon:'🏠',first:'В игре незнакомец пишет: «Скажи свой домашний адрес — пришлю подарок!»',second:'Игрок, которого Пиксель не знает, обещает приз и просит домашний адрес.',opts:['Напишу адрес','Напишу только номер дома','Не отвечу и покажу взрослому'],answer:2,why:'Адрес — личная информация. Незнакомцам его сообщать нельзя.'},
  {icon:'📸',first:'Пиксель хочет отправить свою фотографию в чат незнакомому игроку.',second:'Пиксель хочет отправить свою фотографию человеку, с которым познакомился только в игре.',opts:['Сначала спрошу взрослого','Сразу отправлю','Добавлю к фото адрес'],answer:0,why:'Фотографии и сведения о себе лучше обсуждать со взрослым до отправки.'}
 ]},
 {name:'Незнакомец в игре',icon:'💬',win:'В интернете не всегда известно, кто пишет. Просьба скрыть разговор — повод рассказать взрослому.',items:[
  {icon:'🤫',first:'Кто-то пишет: «Давай дружить! Только маме и папе не говори».',second:'Незнакомый игрок предлагает общаться тайно и просит ничего не рассказывать родителям.',opts:['Соглашусь хранить секрет','Перестану отвечать и расскажу взрослому','Отправлю своё фото'],answer:1,why:'Если кто-то просит скрывать общение от близких взрослых, обязательно расскажи об этом.'},
  {icon:'📞',first:'Незнакомый игрок просит номер телефона мамы.',second:'Игрок просит телефон родителя, чтобы «договориться о подарке».',opts:['Напишу номер','Попрошу сначала прислать подарок','Не сообщу номер, покажу сообщение взрослому'],answer:2,why:'Номера телефонов близких — тоже личная информация.'}
 ]},
 {name:'Ловушка с подарком',icon:'🎁',win:'Если тебя торопят, обещают необычный приз или просят пароль — остановись и спроси взрослого.',items:[
  {icon:'🎮',first:'На экране: «10 000 монет! Нажми за 10 секунд!»',second:'Появилось сообщение: «Вы выиграли 10 000 игровых монет! Срочно нажмите!»',opts:['Нажму скорее','Не нажму и покажу взрослому','Нажму, а потом закрою'],answer:1,why:'Неожиданные подарки и срочность часто используют как ловушку.'},
  {icon:'⬇️',first:'Пиксель хочет установить новую игру.',second:'Пиксель нашёл незнакомый сайт, где предлагают скачать новую игру.',opts:['Скачаю по первой ссылке','Установлю тайком','Сначала спрошу взрослого'],answer:2,why:'Новые игры и приложения устанавливаем только с разрешения взрослого.'}
 ]},
 {name:'Не оставайся один',icon:'🛡️',win:'Если страшно, неприятно или ты ошибся — можно и нужно попросить помощи.',items:[
  {icon:'😟',first:'Кто-то написал Пикселю обидные слова.',second:'Игрок прислал Пикселю грубое и обидное сообщение.',opts:['Напишу обидное в ответ','Никому не расскажу','Не буду ругаться, покажу взрослому'],answer:2,why:'Не нужно отвечать грубостью. Взрослый поможет остановить неприятное общение.'},
  {icon:'😬',first:'Пиксель случайно нажал странную кнопку. Ему страшно.',second:'Пиксель уже нажал на подозрительную ссылку и теперь переживает.',opts:['Сразу расскажу взрослому','Спрячу телефон','Нажму ещё раз'],answer:0,why:'Даже если ошибся — не скрывай. Взрослый поможет разобраться.'}
 ]}
];
const all=missions.flatMap(m=>m.items);
function robotSvg(){return `<svg class="robot" viewBox="0 0 320 350" role="img" aria-label="Робот Пиксель улыбается"><rect x="138" y="16" width="44" height="42" rx="15" fill="#6c82ac"/><circle cx="160" cy="17" r="13" fill="#ffca2e"/><rect x="45" y="58" width="230" height="170" rx="56" fill="#f7c928" stroke="#1f2b47" stroke-width="8"/><rect x="65" y="85" width="190" height="113" rx="36" fill="#223252"/><ellipse cx="116" cy="139" rx="22" ry="29" fill="#8ff1f6"/><ellipse cx="203" cy="139" rx="22" ry="29" fill="#8ff1f6"/><circle cx="122" cy="132" r="7" fill="#fff"/><circle cx="209" cy="132" r="7" fill="#fff"/><path d="M140 169 Q160 187 180 169" fill="none" stroke="#8ff1f6" stroke-width="7" stroke-linecap="round"/><rect x="83" y="229" width="154" height="86" rx="30" fill="#f7c928" stroke="#1f2b47" stroke-width="8"/><rect x="116" y="246" width="88" height="45" rx="18" fill="#fff0ad"/><path d="M34 241 Q4 241 12 275 Q17 292 45 282" stroke="#1f2b47" stroke-width="18" stroke-linecap="round" fill="none"/><path d="M286 241 Q316 241 308 275 Q303 292 275 282" stroke="#1f2b47" stroke-width="18" stroke-linecap="round" fill="none"/><rect x="98" y="307" width="40" height="29" rx="12" fill="#1f2b47"/><rect x="181" y="307" width="40" height="29" rx="12" fill="#1f2b47"/></svg>`}
function shieldPieces(n){return `<div class="shield-pieces" aria-label="Собранные части щита">${missions.map((m,i)=>`<div class="shield-piece ${i<n?'earned':''}" title="${m.name}">${m.icon}</div>`).join('')}</div>`}
function render(){
 teacherButton.textContent=screen==='teacher'?'↩ Вернуться к игре':'👩‍🏫 Для преподавателя';
 if(screen==='start')return start();
 if(screen==='question')return question();
 if(screen==='milestone')return milestone();
 if(screen==='finish')return finish();
 if(screen==='teacher')return teacher();
}
function start(){main.innerHTML=`<section class="intro-grid"><div class="intro"><div class="eyebrow">Урок-приключение • 22 октября 2026</div><h1>Операция<br>КИБЕРЩИТ 🛡️</h1><p>Робот Пиксель попал в интернет и не знает, что безопасно. Помоги ему пройти <b>4 испытания</b> и собрать защитный щит!</p><div class="grade-label">В каком ты классе?</div><div class="grade-row"><button class="grade ${grade===1?'active':''}" data-grade="1">1 класс</button><button class="grade ${grade===2?'active':''}" data-grade="2">2 класс</button></div><div class="actions"><button class="primary" id="startButton">Начать миссию →</button></div><div class="hint">Работайте вдвоём: один читает и обсуждает, второй нажимает. Потом поменяйтесь.</div></div><div class="hero"><div class="halo"></div>${robotSvg()}<div class="hero-bubble">Привет! 👋</div></div></section>`;
 main.querySelectorAll('[data-grade]').forEach(el=>el.addEventListener('click',()=>{grade=Number(el.dataset.grade);render()}));
 document.getElementById('startButton').addEventListener('click',()=>{questionIndex=0;selected=null;correct=false;screen='question';render()});
}
function question(){
 const mi=Math.floor(questionIndex/2), m=missions[mi], q=all[questionIndex];
 main.innerHTML=`<div class="progress"><div><div class="mission-tag">ИСПЫТАНИЕ ${mi+1} ИЗ 4 • ВОПРОС ${questionIndex+1} ИЗ 8</div><div class="mission-title">${m.icon} ${m.name}</div></div><div class="dots">${all.map((_,i)=>`<span class="dot ${i<questionIndex?'done':i===questionIndex?'current':''}"></span>`).join('')}</div></div><div class="story"><div class="story-icon">${q.icon}</div><div><div class="label">Что случилось с Пикселем?</div><h2>${grade===1?q.first:q.second}</h2></div></div><div class="question">Как поступить безопаснее?</div><div class="choices">${q.opts.map((o,i)=>`<button class="choice ${selected===i?(correct?'correct':'wrong'):''}" data-choice="${i}" ${correct?'disabled':''}><span class="letter">${'АБВ'[i]}</span><span>${o}</span></button>`).join('')}</div><div id="feedbackRegion">${selected===null?'':feedbackHtml(q)}</div>`;
 main.querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>{if(correct)return;selected=Number(el.dataset.choice);correct=selected===q.answer;render();document.getElementById('feedbackRegion').scrollIntoView({block:'nearest',behavior:'smooth'})}));
 const next=document.getElementById('nextButton');if(next)next.addEventListener('click',()=>{selected=null;correct=false;if(questionIndex%2===1){screen='milestone'}else{questionIndex++;screen='question'}render()});
}
function feedbackHtml(q){return correct?`<div class="feedback good" role="status"><strong>⭐ Верно! Пиксель в безопасности.</strong>${q.why}</div><div class="feedback-actions"><button class="primary" id="nextButton">${questionIndex%2===1?'Получить часть щита →':'Следующая ситуация →'}</button></div>`:`<div class="feedback retry" role="status"><strong>Давай подумаем ещё раз.</strong>Так Пиксель может оказаться в неприятной ситуации. Выбери вариант, который поможет ему сохранить безопасность.</div>`}
function milestone(){const mi=Math.floor(questionIndex/2),m=missions[mi],earned=mi+1;main.innerHTML=`<section class="milestone"><div class="eyebrow">Миссия выполнена</div><div class="big">${m.icon}</div><h2>Часть Киберщита получена!</h2><p>${m.win}</p>${shieldPieces(earned)}${earned===2?'<div class="role-switch">🔁 Поменяйтесь ролями! Теперь Навигатор управляет мышкой, а Пилот помогает выбирать.</div>':''}<div class="actions" style="justify-content:center"><button class="primary" id="continueButton">${earned===4?'Собрать Киберщит →':'Следующее испытание →'}</button></div></section>`;document.getElementById('continueButton').addEventListener('click',()=>{if(earned===4){screen='finish'}else{questionIndex++;screen='question'}render()})}
function finish(){main.innerHTML=`<section class="milestone final"><div class="eyebrow">Все четыре испытания пройдены</div><div class="big">🛡️✨</div><h1>КИБЕРЩИТ СОБРАН!</h1><p>Ты помог Пикселю и научился принимать безопасные решения в интернете.</p>${shieldPieces(4)}<div class="rule">🛑 СТОП</div><div class="rule">👆 НЕ ОТВЕЧАЙ И НЕ НАЖИМАЙ</div><div class="rule">🧑‍🧑‍🧒 ПОКАЖИ ВЗРОСЛОМУ</div><p><b>Потренируйся сказать:</b><br>«Мне пришло странное сообщение. Помоги мне разобраться!»</p><div class="actions" style="justify-content:center"><button class="primary" id="restartButton">Пройти ещё раз ↻</button></div></section>`;document.getElementById('restartButton').addEventListener('click',()=>{screen='start';questionIndex=0;selected=null;correct=false;render()})}
function teacher(){main.innerHTML=`<section class="teacher-view"><div class="eyebrow">Памятка ведущему</div><h2>Как провести урок за 40 минут</h2><div class="teacher-grid"><div class="teacher-box"><h3>⏱️ План</h3><ul><li><b>0–4 мин:</b> история Пикселя и цель миссии.</li><li><b>4–8 мин:</b> на проекторе показать пример вопроса.</li><li><b>8–10 мин:</b> пары и роли.</li><li><b>10–27 мин:</b> работа за компьютерами (8 ситуаций).</li><li><b>27–33 мин:</b> обсудить 2–3 сложных решения.</li><li><b>33–37 мин:</b> потренировать просьбу о помощи.</li><li><b>37–40 мин:</b> повторить правила и завершить.</li></ul></div><div class="teacher-box"><h3>🖥️ Перед уроком</h3><ul><li>Проверить файл на школьных компьютерах и проекторе.</li><li>Разложить файл на компьютеры разрешённым школьным способом.</li><li>Открыть двойным щелчком в Chrome/Edge; интернет не требуется.</li><li>При необходимости нажать F11 для полноэкранного режима.</li><li>Для 1 класса читать условия вслух, идти вместе с классом.</li></ul></div><div class="teacher-box"><h3>👫 Один компьютер на двоих</h3><p><b>Пилот</b> нажимает кнопки. <b>Навигатор</b> объясняет, почему ответ безопасен. После второго испытания дети меняются. Не оценивать детей по скорости и не устраивать соревнование.</p></div><div class="teacher-box"><h3>🔒 Безопасность</h3><p>Не просить настоящие пароли, адреса, номера телефонов, фотографии. Не открывать реальные подозрительные ссылки. Если ребёнок расскажет о реальном неприятном случае — спокойно выслушать и передать вопрос ответственному педагогу согласно правилам школы.</p></div></div><h3>Вопросы для обсуждения</h3><ul><li>Почему просьба «никому не рассказывай» настораживает?</li><li>Что делать, если уже нажал на странную ссылку?</li><li>К какому взрослому можно обратиться за помощью?</li></ul><div class="actions"><button class="secondary" id="backButton">← Вернуться к игре</button><button class="secondary" id="resetButton">Начать игру сначала</button></div></section>`;document.getElementById('bac
